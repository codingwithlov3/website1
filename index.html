<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sana bir gül</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg1:#2a0510;--bg2:#08010a;--ink:#f6dfe2;--soft:#d9a0ab;--gold:#e8c27a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2) 75%);background-color:#08010a;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;overflow-x:hidden}
#fall{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
main{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(24px,6vw,90px);padding:40px 20px 30px;min-height:100vh}
.roseWrap{width:min(340px,80vw);filter:drop-shadow(0 0 40px rgba(220,30,60,.35));animation:sway 7s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(2.2deg)}}
.roseWrap svg{width:100%;height:auto;display:block;overflow:visible}
.pt{transform-box:view-box;animation:open 1.6s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes open{from{transform:scale(.05);opacity:0}to{transform:scale(1);opacity:1}}
.stem{stroke-dasharray:420;stroke-dashoffset:420;animation:grow 2.4s .2s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.leaf{animation:leaf 1.6s 1.6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes leaf{from{transform:scale(0)}to{transform:scale(1)}}
.side{display:flex;flex-direction:column;align-items:center;gap:26px;max-width:92vw}
.frame{position:relative;width:min(300px,76vw);aspect-ratio:4/5;padding:14px 14px 56px;background:#fbf3ee;border-radius:4px;transform:rotate(-3deg);box-shadow:0 25px 60px rgba(0,0,0,.6),0 0 50px rgba(255,80,110,.25);cursor:pointer;animation:drop 1.4s 3.4s cubic-bezier(.2,.9,.3,1.1) both;transition:transform .5s}
.frame:hover,.frame:focus-within{transform:rotate(0) scale(1.03)}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(-12deg)}to{opacity:1;transform:rotate(-3deg)}}
.frame .ph{width:100%;height:100%;background:linear-gradient(160deg,#5b1626,#2a0510);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--soft);text-align:center;font-size:1.15rem;padding:16px;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;display:block;animation:dev 2.4s ease-out both}
@keyframes dev{from{filter:sepia(1) blur(8px) brightness(.4)}to{filter:none}}
.frame input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:"Great Vibes",cursive,serif;font-size:1.9rem;color:#8c1d33}
.heart{animation:beat 1.3s infinite}
@keyframes beat{15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.msg{text-align:center;min-height:5.2em}
.msg h1{font-family:"Great Vibes",cursive,serif;font-weight:400;font-size:clamp(2.6rem,7vw,3.8rem);margin:0;color:var(--gold);text-shadow:0 0 24px rgba(232,194,122,.35)}
.msg p{margin:6px 0 0;font-style:italic;font-size:1.3rem;color:var(--soft);line-height:1.5;max-width:26ch;margin-inline:auto}
.fade{opacity:0;animation:in 2s forwards}
@keyframes in{to{opacity:1}}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.hearts i{position:absolute;bottom:-40px;font-style:normal;color:#ff4d6d;opacity:0;animation:up linear infinite}
@keyframes up{10%{opacity:.7}100%{transform:translateY(-110vh) translateX(var(--dx));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<canvas id="fall"></canvas>
<main>
  <div class="roseWrap">
    <svg viewBox="-130 -125 260 520" aria-label="Kırmızı gül">
      <defs>
        <radialGradient id="g0" cx="0" cy="-45" r="85" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5c0014"/><stop offset=".55" stop-color="#a50a26"/><stop offset="1" stop-color="#e0334d"/></radialGradient>
        <radialGradient id="g1" cx="0" cy="-35" r="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4a000f"/><stop offset=".6" stop-color="#9a0820"/><stop offset="1" stop-color="#d12644"/></radialGradient>
        <radialGradient id="g2" cx="0" cy="-28" r="55" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3a000b"/><stop offset=".6" stop-color="#8a061c"/><stop offset="1" stop-color="#bf1d3b"/></radialGradient>
        <radialGradient id="g3" cx="0" cy="-20" r="40" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2b0008"/><stop offset=".6" stop-color="#730518"/><stop offset="1" stop-color="#a8162f"/></radialGradient>
        <linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#16401f"/><stop offset=".5" stop-color="#2f7a3a"/><stop offset="1" stop-color="#14361b"/></linearGradient>
        <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c5a2a"/><stop offset="1" stop-color="#3f9a4d"/></linearGradient>
        <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity=".55"/></filter>
      </defs>
      <path class="stem" d="M0 20 C-10 110 14 200 2 380" fill="none" stroke="url(#st)" stroke-width="8" stroke-linecap="round"/>
      <g class="leaf" style="transform-origin:-4px 250px"><path d="M-3 250 C-50 215 -100 225 -112 205 C-80 170 -20 200 -3 250Z" fill="url(#lf)" filter="url(#sh)"/><path d="M-5 248 C-40 228 -75 215 -105 207" stroke="#a9e3a0" stroke-opacity=".4" fill="none"/></g>
      <g class="leaf" style="transform-origin:4px 310px;animation-delay:2s"><path d="M4 310 C50 275 95 285 108 262 C78 232 20 262 4 310Z" fill="url(#lf)" filter="url(#sh)"/><path d="M6 308 C40 288 70 275 100 264" stroke="#a9e3a0" stroke-opacity=".4" fill="none"/></g>
      <g id="bloom"></g>
    </svg>
  </div>
  <div class="side">
    <label class="frame" tabindex="0">
      <div class="ph" id="ph">
  <img
      src="./photo.jpeg"
      alt="Bizim fotoğrafımız"
      class="photo"
    >
  </div>
      <span class="cap">Sonsuza dek</span>
    </label>
    <div class="msg">
      <h1 class="fade" style="animation-delay:4.4s">Seni seviyorum</h1>
      <p class="fade" style="animation-delay:5.6s">Seni evren kadar seviyorum. Her geçen gün aynı evren gibi sana olan sevgim git gide daha da büyüyor, iyiki varsın, iyiki sevgilimsin, bir tanemsin, hayatımın anlamı, canım sevgilim. 🤍🫂🤍🫂</p>
    </div>
  </div>
</main>
<script>
(function(){
  var rings=[[5,1,0,'g0',0],[5,.84,36,'g1',.35],[4,.66,18,'g2',.7],[3,.48,50,'g3',1.05],[3,.32,10,'g3',1.4]];
  var h='',k=0;
  rings.forEach(function(r){
    for(var i=0;i<r[0];i++){
      var a=r[2]+i*360/r[0]+(i%2?5:-5),s=r[1];
      var d=r[4]+i*.12;
      h+='<g transform="rotate('+a+')"><g class="pt" style="animation-delay:'+(1.2+d)+'s;transform-origin:0 0"><g transform="translate(0,'+(-8*s)+') scale('+s+')">'
       +'<path d="M0 0 C-42 -18 -52 -72 -24 -96 C-10 -106 10 -106 24 -96 C52 -72 42 -18 0 0Z" fill="url(#'+r[3]+')" filter="url(#sh)"/>'
       +'<path d="M-24 -96 C-10 -106 10 -106 24 -96" fill="none" stroke="#ff9aa8" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>'
       +'<path d="M0 -4 C-8 -40 -6 -70 0 -88" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="1.4"/>'
       +'<ellipse cx="-12" cy="-80" rx="9" ry="16" fill="#fff" opacity=".07" transform="rotate(-18 -12 -80)"/>'
       +'</g></g></g>';
    }
  });
  h+='<g class="pt" style="animation-delay:2.7s"><circle r="9" fill="#2b0008"/><path d="M-6 0 C-6 -8 6 -8 6 0 C6 6 -3 6 -3 1" fill="none" stroke="#c4223e" stroke-width="1.6" stroke-linecap="round"/></g>';
  document.getElementById('bloom').innerHTML=h;

  var f=document.getElementById('file');
  if(f)f.addEventListener('change',function(){
    var file=f.files&&f.files[0];if(!file)return;
    var img=new Image();img.alt='Fotoğrafımız';
    img.onload=function(){var ph=document.getElementById('ph');ph.innerHTML='';ph.style.padding='0';ph.style.background='none';ph.appendChild(img)};
    img.src=URL.createObjectURL(file);
  });

  var hb=document.getElementById('hearts');
  for(var i=0;i<16;i++){
    var e=document.createElement('i');e.textContent='♥';
    e.style.left=Math.random()*100+'%';e.style.fontSize=(10+Math.random()*18)+'px';
    e.style.animationDuration=(9+Math.random()*10)+'s';e.style.animationDelay=(Math.random()*12+3)+'s';
    e.style.setProperty('--dx',(Math.random()*80-40)+'px');hb.appendChild(e);
  }

  var c=document.getElementById('fall'),x=c.getContext('2d'),W,H,P=[];
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
  var COL=['#b3122f','#d92b4b','#8c0d24','#e8506a'];
  // side: 0 = üstten, -1 = soldan, 1 = sağdan
  function mk(init,side){
    var p={x:Math.random()*W,y:init?Math.random()*H:-20,s:6+Math.random()*9,v:.5+Math.random()*1.1,w:Math.random()*Math.PI*2,r:Math.random()*6.28,vr:(Math.random()-.5)*.03,c:COL[Math.floor(Math.random()*4)],vx:0,side:side||0};
    if(side){
      var L=side<0;
      p.x=init?(L?Math.random()*W*.3:W-Math.random()*W*.3):(L?-20:W+20);
      p.y=Math.random()*H*(init?.9:.6);
      p.vx=(L?1:-1)*(.8+Math.random()*1.8);
      p.v=.4+Math.random()*.9;
      p.s=7+Math.random()*10;
    }
    return p;
  }
  for(var j=0;j<26;j++)P.push(mk(true,0));
  for(var j=0;j<16;j++){P.push(mk(true,-1));P.push(mk(true,1));}
  var t0=performance.now();
  (function loop(t){
    x.clearRect(0,0,W,H);
    if(t-t0>3500)P.forEach(function(p){
      p.y+=p.v;p.w+=.02;p.x+=Math.sin(p.w)*.8+p.vx;p.r+=p.vr;
      if(p.side)p.vx*=.995;
      if(p.y>H+20||p.x<-80||p.x>W+80)Object.assign(p,mk(false,p.side));
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.abs(Math.cos(p.w))*.6+.4);
      x.fillStyle=p.c;x.globalAlpha=.85;x.beginPath();
      x.moveTo(0,-p.s);x.bezierCurveTo(p.s,-p.s*.6,p.s*.8,p.s*.7,0,p.s);x.bezierCurveTo(-p.s*.8,p.s*.7,-p.s,-p.s*.6,0,-p.s);x.fill();x.restore();
    });
    requestAnimationFrame(loop);
  })(t0);
})();
</script>
</body>
</html>
